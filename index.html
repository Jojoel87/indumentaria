<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pedido de Indumentaria</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://i.ibb.co/ZJvBDpX/cancha-verde.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      padding: 20px;
    }
    form {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
    }
    input, select, textarea, button {
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
    button {
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
    }
    h1 {
      text-align: center;
      color: #00ff00;
    }
  </style>
</head>
<body>
  <form id="pedidoForm">
    <h1>Pedido de Indumentaria</h1>
    <input type="text" name="equipo" placeholder="Nombre del equipo" required>
    <input type="text" name="jugador" placeholder="Nombre del jugador" required>
    <input type="number" name="numero" placeholder="Número" required>

    <label for="articulo">Artículo:</label>
    <select name="articulo" multiple required>
      <option value="Camiseta">Camiseta</option>
      <option value="Short">Short</option>
      <option value="Medias">Medias</option>
    </select>

    <input type="text" name="talle" placeholder="Talle camiseta (S, M, L, etc.)" required>
    <input type="checkbox" name="short" value="Sí"> Incluir short<br><br>
    <input type="text" name="shortTalle" placeholder="Talle del short (si aplica)">
    <textarea name="comentarios" placeholder="Comentarios adicionales..."></textarea>

    <button type="submit">Enviar pedido</button>
  </form>

  <script>
    const form = document.getElementById("pedidoForm");
    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const data = new FormData(form);
      const params = new URLSearchParams();

      for (const pair of data.entries()) {
        params.append(pair[0], pair[1]);
      }

      // Incluir todos los artículos seleccionados
      const articulosSeleccionados = [...form.articulo.selectedOptions].map(opt => opt.value);
      params.delete('articulo');
      articulosSeleccionados.forEach(item => params.append('articulo', item));

      fetch("https://script.google.com/macros/s/AKfycbyWccCqKHkGXsOO0iMFt0VV6jVTXQRMvIO7pf220iJC2_aP1yMcqPsgDBZ_w0/exec", {
        method: "POST",
        body: params
      })
      .then(res => res.text())
      .then(msg => {
        alert(msg);
        form.reset();
      })
      .catch(err => {
        alert("Error al enviar el pedido.");
        console.error(err);
      });
    });
  </script>
</body>
</html>
