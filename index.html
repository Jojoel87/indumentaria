<script>
  document.getElementById("pedidoForm").onsubmit = function(event) {
    event.preventDefault(); // Para evitar el comportamiento por defecto del formulario
    
    var equipo = document.getElementById("equipo").value;
    var comentarios = document.getElementById("comentarios").value;

    // Aquí recogemos todos los jugadores y los agregamos a un array
    var jugadores = [];
    for (var i = 1; i <= cantidadJugadores; i++) {
      var jugador = {
        nombre: document.getElementById("jugador" + i).value,
        numero: document.getElementById("numero" + i).value,
        articulo: document.getElementById("articulo" + i).value,
        talle: document.getElementById("talle" + i).value,
        short: document.getElementById("short" + i).value,
        shortTalle: document.getElementById("shortTalle" + i).value
      };
      jugadores.push(jugador);
    }

    // Convertimos el array a un JSON
    var jugadoresJSON = JSON.stringify(jugadores);

    // Construimos la URL de la solicitud GET para enviar los datos a Google Apps Script
    var url = "https://script.google.com/macros/s/AKfycby2TaQLdoABlNRB900Tr6jUXSYX1Hx_l76-jJoId3ucluAB9SDMC1Gp_ZSlaEUGoa2Z/exec";
    var params = new URLSearchParams();
    params.append("equipo", equipo);
    params.append("comentarios", comentarios);
    params.append("jugadores", jugadoresJSON);

    // Hacemos la solicitud GET
    fetch(url + "?" + params.toString())
      .then(response => response.text())
      .then(result => alert(result))
      .catch(error => console.log('Error:', error));
  };
</script>
