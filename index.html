<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedido de Indumentaria Deportiva</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1611506815197-52f8639b3053?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1200') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.7);
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      border-radius: 15px;
    }
    h1 {
      text-align: center;
      color: #00ff7f;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: none;
    }
    button {
      background-color: #00ff7f;
      border: none;
      padding: 12px;
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .message {
      display: none;
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      color: #00ff7f;
    }
    .player-section {
      margin-bottom: 20px;
      padding: 15px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
    }
    .remove-player {
      color: red;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pedido de Indumentaria</h1>
    <form id="pedidoForm" action="https://formsubmit.co/ajax/joelcirulli@gmail.com" method="POST">
      <div id="playersContainer">
        <div class="player-section" id="player1">
          <label>Nombre del equipo</label>
          <input type="text" name="equipo" required>
          <label>Nombre del jugador</label>
          <input type="text" name="jugador" required>
          <label>Número del jugador</label>
          <input type="text" name="numero" required>
          <label>Seleccioná los artículos</label>
          <select name="articulo[]" multiple required>
            <option value="Camiseta">Camiseta</option>
            <option value="Short">Short</option>
            <option value="Medias">Medias</option>
            <option value="Buzo">Buzo</option>
            <option value="Otro">Otro</option>
          </select>
          <label>Talle</label>
          <select name="talle[]" required>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
            <option value="Otro">Otro</option>
          </select>
          <label>¿Quiere Short con talle diferente?</label>
          <select name="short[]" onchange="toggleShortSize(this, 'player1')" required>
            <option value="No">No</option>
            <option value="Sí">Sí</option>
          </select>
          <div id="shortSizePlayer1" style="display:none;">
            <label>Talle del Short</label>
            <select name="shortTalle[]" required>
              <option value="XS">XS</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="XXL">XXL</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
          <label>Comentarios adicionales</label>
          <textarea name="comentarios"></textarea>
          <span class="remove-player" onclick="removePlayer('player1')">Eliminar jugador</span>
        </div>
      </div>

      <button type="button" onclick="addPlayer()">Añadir otro jugador</button>
      <button type="submit">Enviar pedido</button>
    </form>

    <div class="message" id="mensajeConfirmacion">✅ Tu pedido fue enviado. ¡Gracias!</div>

    <button onclick="descargarExcel()">📥 Descargar pedidos en Excel</button>
  </div>

  <script>
    function toggleShortSize(select, playerId) {
      const shortSizeField = document.getElementById('shortSize' + playerId);
      shortSizeField.style.display = select.value === 'Sí' ? 'block' : 'none';
    }

    function addPlayer() {
      const container = document.getElementById('playersContainer');
      const count = container.getElementsByClassName('player-section').length + 1;
      const div = document.createElement('div');
      div.classList.add('player-section');
      div.id = 'player' + count;
      div.innerHTML = document.getElementById('player1').innerHTML.replaceAll('player1', 'player' + count);
      container.appendChild(div);
    }

    function removePlayer(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    document.getElementById('pedidoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = this;
      fetch(form.action, {
        method: form.method,
        body: new FormData(form)
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          form.reset();
          document.getElementById('mensajeConfirmacion').style.display = 'block';
        } else {
          alert("Hubo un error al enviar el formulario.");
        }
      })
      .catch(() => alert("Error al enviar el formulario."));
    });

    function descargarExcel() {
      const id = '1X7dsCfJwYlZW70Vd9op9hLynmfN-0z7HChQHgbRvtyg'; // <-- Usá tu ID de Google Sheets
      const url = `https://docs.google.com/spreadsheets/d/${id}/export?format=xlsx`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
