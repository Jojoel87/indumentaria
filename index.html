<!DOCTYPE html>
<html>
<head>
    <title>Formulario de Pedido</title>
</head>
<body>
    <h1>Formulario de Pedido</h1>
    <form id="pedidoForm">
        <label for="file">Selecciona el archivo Excel:</label>
        <input type="file" id="file" name="file" required><br><br>
        <button type="submit">Enviar Pedido</button>
    </form>

    <script>
        document.getElementById('pedidoForm').addEventListener('submit', function(event) {
            event.preventDefault();

            var formData = new FormData();
            var file = document.getElementById('file').files[0];
            
            // Convertimos el archivo a base64
            var reader = new FileReader();
            reader.onloadend = function () {
                var fileBase64 = reader.result.split(',')[1]; // Eliminar el encabezado de base64

                formData.append('file', fileBase64);

                // Enviar el archivo al Google Apps Script
                fetch('https://script.google.com/macros/s/AKfycbzDy10N2C-ykQFee5LY79ysRyV5tStiEbO7wOyrtUKNP9iUY7bX0t_kUr0vkpxeOay6/exec', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.text())
                .then(data => {
                    alert(data); // Muestra el mensaje de éxito o error
                })
                .catch(error => {
                    alert('Error al enviar el archivo: ' + error);
                });
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
