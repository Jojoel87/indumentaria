<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Pedido</title>
    <style>
        /* Estilo básico del formulario */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            max-width: 500px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h1>Formulario de Pedido de Indumentaria</h1>

    <form id="pedidoForm">
        <label for="equipo">Equipo:</label>
        <input type="text" id="equipo" name="equipo" required><br>

        <label for="jugador">Nombre del Jugador:</label>
        <input type="text" id="jugador" name="jugador" required><br>

        <label for="numero">Número de Camiseta:</label>
        <input type="number" id="numero" name="numero" required><br>

        <label for="articulo">Artículo:</label>
        <select id="articulo" name="articulo" required>
            <option value="Camiseta">Camiseta</option>
            <option value="Pantalón">Pantalón</option>
            <option value="Buzo">Buzo</option>
        </select><br>

        <label for="talle">Talle:</label>
        <select id="talle" name="talle" required>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
        </select><br>

        <label for="short">¿Incluye Short?</label>
        <select id="short" name="short">
            <option value="Sí">Sí</option>
            <option value="No">No</option>
        </select><br>

        <label for="shortTalle">Talle del Short (si aplica):</label>
        <select id="shortTalle" name="shortTalle">
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="No">No Aplica</option>
        </select><br>

        <label for="comentarios">Comentarios:</label>
        <textarea id="comentarios" name="comentarios"></textarea><br>

        <button type="submit">Enviar Pedido</button>
    </form>

    <script>
        document.getElementById('pedidoForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var formData = new FormData(this);
            var data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            fetch('https://script.google.com/macros/s/AKfycby2TaQLdoABlNRB900Tr6jUXSYX1Hx_l76-jJoId3ucluAB9SDMC1Gp_ZSlaEUGoa2Z/exec', {
                method: 'POST',
                body: new URLSearchParams(data),
            })
            .then(response => response.text())
            .then(result => {
                alert("¡Pedido enviado con éxito!");
                this.reset(); // Limpiar el formulario
            })
            .catch(error => {
                alert("Hubo un error al enviar el pedido.");
                console.error(error);
            });
        });
    </script>

</body>
</html>
